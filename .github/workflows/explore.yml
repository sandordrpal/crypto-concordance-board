name: explore-fetch
# Exploratory only (not part of any registered test): download BTCUSDT hourly candles as a run artifact.
on:
  push:
    branches: ["explore/**"]
    paths: [".github/workflows/explore.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests pandas 2>&1 | tail -1
      - name: Download daily candles for 10 coins
        run: |
          python - <<'PY2'
          import requests, time, pandas as pd
          url = "https://data-api.binance.vision/api/v3/klines"
          out = {}
          for c in ["BTC","ETH","BNB","SOL","XRP","ADA","DOGE","AVAX","LINK","LTC"]:
              start, rows = 1502928000000, []
              while True:
                  r = requests.get(url, params=dict(symbol=c+"USDT", interval="1d", startTime=start, limit=1000), timeout=30)
                  r.raise_for_status(); k = r.json()
                  if not k: break
                  rows += k; start = k[-1][0] + 86400_000
                  if len(k) < 1000: break
                  time.sleep(0.2)
              df = pd.DataFrame(rows).iloc[:, [0, 4, 6, 7]]
              df.columns = ["open_time", "close", "close_time", "quote_volume"]
              df = df[df.close_time < time.time() * 1000]
              df["coin"] = c; out[c] = df; print(c, len(df))
          pd.concat(out.values()).to_csv("coins_1d.csv", index=False)
          PY2
          gzip -9 coins_1d.csv
      - name: Commit the data to this branch
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add coins_1d.csv.gz && git commit -q -m "Exploratory data: 10 coins daily" && git push -q
