name: research

# Collects the daily variables, trains and tests the models, and publishes the data and the
# report to the `research-results` branch. Runs on demand, when the research code changes,
# and once a day so the variables stay current. Delete the `schedule` block to stop daily runs.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["research/**", ".github/workflows/research.yml"]
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          set -o pipefail
          mkdir -p out/logs
          python -m pip install --upgrade pip 2>&1 | tail -1
          pip install torch --index-url https://download.pytorch.org/whl/cpu 2>&1 | tail -2 | tee out/logs/install.log
          pip install -r research/requirements.txt 2>&1 | tail -2 | tee -a out/logs/install.log
          pip freeze > out/logs/packages.txt

      - name: Collect data
        run: |
          set -o pipefail
          python research/collect.py --out out/data 2>&1 | tee out/logs/collect.log

      - name: Train, validate and test
        run: |
          set -o pipefail
          python research/model.py --data out/data --out out/results 2>&1 | tee out/logs/model.log

      - name: Publish to research-results branch
        if: always()
        run: |
          cd out
          if [ -f results/REPORT.md ]; then
            sed -E 's#\]\(([A-Za-z0-9_]+\.png)\)#](results/\1)#g' results/REPORT.md > README.md
          else
            printf '# Research run %s did not finish\n\nSee logs/ for the error.\n' "$GITHUB_RUN_ID" > README.md
          fi
          echo "{\"run_id\": \"$GITHUB_RUN_ID\", \"sha\": \"$GITHUB_SHA\", \"finished_utc\": \"$(date -u +%FT%TZ)\"}" > run.json
          git init -q -b research-results
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Research run $GITHUB_RUN_ID ($(date -u +%F))"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" research-results
