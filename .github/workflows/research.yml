name: research

# Collects the daily variables and hourly candles, runs the four research tracks in parallel and
# publishes data, reports and the pre-registered scorecard to the `research-results` branch.
# Runs on demand, when the research code changes, and once a day. Delete `schedule` to stop daily runs.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["research/**.py", "!research/live_ranges.py", "research/requirements.txt", ".github/workflows/research.yml"]
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

concurrency:
  group: research
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r research/requirements.txt 2>&1 | tail -1
      - name: Restore hourly-file cache
        uses: actions/cache@v4
        with:
          path: hf_cache
          key: hf-${{ github.run_id }}
          restore-keys: hf-
      - name: Daily variables
        run: |
          set -o pipefail; mkdir -p out/logs
          python research/collect.py --out out/data 2>&1 | tee out/logs/collect.log
      - name: Hourly candles
        run: |
          set -o pipefail
          python research/collect_hf.py --out out --cache hf_cache 2>&1 | tee out/logs/collect_hf.log
      - uses: actions/upload-artifact@v4
        with:
          name: inputs
          path: out
          retention-days: 3

  collect_v2:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r research/requirements.txt 2>&1 | tail -1
      - name: Restore version 2 file cache
        uses: actions/cache@v4
        with:
          path: v2_cache
          key: v2-${{ github.run_id }}
          restore-keys: v2-
      - name: Version 2 inputs (futures, DVOL, Coinbase, FOMC)
        run: |
          set -o pipefail; mkdir -p out/logs
          python research/collect_v2.py --out out --cache v2_cache 2>&1 | tee out/logs/collect_v2.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inputs_v2
          path: out
          retention-days: 3

  collect_trades:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        year: [2021, 2022, 2023, 2024, 2025, 2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r research/requirements.txt 2>&1 | tail -1
      - name: Restore large-trade cache
        uses: actions/cache@v4
        with:
          path: trades_cache
          key: trades-${{ matrix.year }}-${{ github.run_id }}
          restore-keys: trades-${{ matrix.year }}-
      - name: Large trades ${{ matrix.year }}
        run: |
          set -o pipefail; mkdir -p out/logs
          python research/collect_trades.py --year ${{ matrix.year }} --out out --cache trades_cache 2>&1 | tee out/logs/collect_trades_${{ matrix.year }}.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trades-${{ matrix.year }}
          path: out
          retention-days: 3

  track:
    needs: [collect, collect_v2, collect_trades]
    if: ${{ always() && needs.collect.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: direction
            cmd: python research/model.py --data out/data --out out/results/direction
          - name: volatility
            cmd: python research/vol.py --hf out/hf --data out/data --out out/results/volatility
          - name: cross_section
            cmd: python research/xsec.py --hf out/hf --out out/results/cross_section
          - name: intraday
            cmd: python research/intraday.py --hf out/hf --data out/data --out out/results/intraday
          - name: v2_volatility
            cmd: python research/v2.py --track vol --hf out/hf --data out/data --v2 out/v2 --out out/results/v2_volatility
          - name: v2_cross_section
            cmd: python research/v2.py --track xsec --hf out/hf --data out/data --v2 out/v2 --out out/results/v2_cross_section
          - name: v2_intraday
            cmd: python research/v2.py --track intraday --hf out/hf --data out/data --v2 out/v2 --out out/results/v2_intraday
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packages
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu 2>&1 | tail -1
          pip install -r research/requirements.txt 2>&1 | tail -1
      - uses: actions/download-artifact@v4
        with:
          name: inputs
          path: out
      - if: startsWith(matrix.name, 'v2_')
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: inputs_v2
          path: out
      - if: startsWith(matrix.name, 'v2_')
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: trades-*
          merge-multiple: true
          path: out
      - name: Run ${{ matrix.name }}
        run: |
          set -o pipefail; mkdir -p out/logs out/results/${{ matrix.name }}
          ${{ matrix.cmd }} 2>&1 | tee out/logs/${{ matrix.name }}.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.name }}
          path: |
            out/results/${{ matrix.name }}
            out/logs/${{ matrix.name }}.log
          retention-days: 3

  publish:
    needs: [collect, collect_v2, collect_trades, track]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Assemble and push
        run: |
          mkdir -p pub/results pub/logs
          if [ -d art/inputs ]; then
            cp -r art/inputs/data pub/data 2>/dev/null || true
            cp art/inputs/logs/* pub/logs/ 2>/dev/null || true
            cp art/inputs/hf/status.json pub/data/hourly_status.json 2>/dev/null || true
          fi
          if [ -d art/inputs_v2 ]; then
            cp art/inputs_v2/logs/* pub/logs/ 2>/dev/null || true
            cp art/inputs_v2/v2/status.json pub/data/v2_status.json 2>/dev/null || true
          fi
          for d in art/trades-*; do
            [ -d "$d" ] || continue
            cp "$d"/logs/* pub/logs/ 2>/dev/null || true
            cp "$d"/trades/status-*.json pub/data/ 2>/dev/null || true
          done
          for d in art/result-*; do
            [ -d "$d" ] || continue
            [ -d "$d/results" ] && cp -r "$d"/results/* pub/results/ 2>/dev/null || true
            [ -d "$d/logs" ] && cp "$d"/logs/* pub/logs/ 2>/dev/null || true
          done
          python research/summarize.py --results pub/results --out pub/README.md --run "$(date -u +%F) (run $GITHUB_RUN_ID)"
          cd pub
          echo "{\"run_id\": \"$GITHUB_RUN_ID\", \"sha\": \"$GITHUB_SHA\", \"finished_utc\": \"$(date -u +%FT%TZ)\"}" > run.json
          git init -q -b research-results
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Research run $GITHUB_RUN_ID ($(date -u +%F))"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" research-results
